[server]
# Mapping and data files uploaded here are small; cap uploads at 20 MB so a
# huge wrong file fails fast instead of being read in full. (Streamlit's
# default is 200 MB.)
maxUploadSize = 20

[theme]
# The app's root font size. Streamlit sizes its own widgets in rem, so raising
# this scales the parts CSS cannot reach - the data preview table above all -
# along with everything else. Default is 16.
baseFontSize = 20

[client]
# Hide Streamlit's own toolbar (the three-dot menu and Deploy button). They
# offer developer actions that do not belong in front of a user of the app.
toolbarMode = "minimal"
